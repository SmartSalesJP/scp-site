<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ページが見つかりません｜SCP</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  html, body { background: #0b0a0c; min-height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: #f4efe8; line-height: 1.6; letter-spacing: .01em; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; min-height: 100dvh;
    padding: 24px clamp(20px, 5vw, 64px);
    background: radial-gradient(60% 50% at 80% 10%, rgba(255,90,48,.22), transparent 70%), #0b0a0c;
  }
  main { max-width: 560px; width: 100%; }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .06em; margin-bottom: 40px; }
  .brand svg { width: 26px; height: 26px; }
  .kicker { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: #857e77; }
  .kicker .dot { color: #ff5a30; }
  h1 { font-size: clamp(30px, 5.4vw, 56px); line-height: 1.04; letter-spacing: -.03em; margin: 18px 0 22px; }
  h1 em { font-style: normal; color: #ff5a30; }
  p { color: #b8b0a8; max-width: 44ch; }
  .btn {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 32px;
    height: 52px; padding: 0 26px; border-radius: 999px;
    background: #ff5a30; color: #0b0a0c; font-size: 14.5px; font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: #ff7a4d; }
  footer { margin-top: 56px; font-size: 12px; color: #857e77; }
</style>
</head>
<body>
<main>
  <a class="brand" href="./" aria-label="SCP トップへ">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <g stroke="#f4efe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 14 8 8 14 8"/><path d="M26 8 32 8 32 14"/><path d="M32 26 32 32 26 32"/><path d="M14 32 8 32 8 26"/>
      </g>
      <path d="M17 13.6 26.6 20 17 26.4Z" fill="#ff5a30"/>
    </svg>
    <b>SCP</b>
  </a>
  <p class="kicker"><span class="dot">●</span>&nbsp; 404 Not Found</p>
  <h1>このページは、<br>まだ<em>届いていない</em>。</h1>
  <p>お探しのページは見つかりませんでした。URL が変わったか、削除された可能性があります。トップページから、あらためてどうぞ。</p>
  <a class="btn" href="./">トップページへ戻る</a>
  <footer>© 2026 合同会社SmartSales / Smart Creative Promotion</footer>
</main>
</body>
</html>
